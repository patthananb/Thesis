; PlatformIO Project Configuration File
;
; ESP32-S3 = device under test (DUT). Each DUT env builds a tiny Arduino-IDE-
; style sketch (or a minimal ESP-IDF app_main) that uses one candidate Modbus
; library to talk to the ESP32-C6 mock RTU slave.
;
; See README.md for the per-candidate strategy and known build statuses.

[platformio]
lib_dir = .pio/empty_lib
; ESP-IDF refuses build paths containing whitespace; route artifacts to /tmp.
build_dir = /tmp/pio_modbus_build
default_envs =
    esp32-c6-fixture
    dut_rob2011_arduino_s3
    dut_vwetter_arduino_s3
    dut_zivillian_arduino_s3
    dut_harihanv_arduino_s3
    dut_tobiasfaust_arduino_s3
    dut_emodbus_arduino_s3
    dut_namnam_iot_arduino_s3
    dut_esp_modbus_espidf_s3
    dut_maxx_ukoo_espidf_s3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[s3_dut_base]
extends = common
framework = arduino
board = 4d_systems_esp32s3_gen4_r8n16
upload_port = /dev/cu.wchusbserial5B141768411
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDUT_RS485_RX_PIN=8
    -DDUT_RS485_TX_PIN=9
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src

[s3_espidf_dut_base]
extends = common
framework = espidf
board = 4d_systems_esp32s3_gen4_r8n16
upload_port = /dev/cu.wchusbserial5B141768411
build_flags =
    -DDUT_RS485_RX_PIN=8
    -DDUT_RS485_TX_PIN=9

[c6_fixture_base]
extends = common
framework = arduino
board = esp32-c6-devkitc-1
upload_port = /dev/cu.usbmodem11201
board_build.cdc_on_boot = 1
lib_ldf_mode = deep+
build_flags =
    -DDUT_RS485_RX_PIN=5
    -DDUT_RS485_TX_PIN=4

[env:esp32-c6-fixture]
extends = c6_fixture_base
build_src_filter =
    -<*>
    +<ESP32C6/>

[env:dut_rob2011_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/rob2011/>
lib_deps =
    emelianov/modbus-esp8266
    bblanchon/ArduinoJson

[env:dut_vwetter_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/vwetter/>

[env:dut_zivillian_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/zivillian/>
lib_deps =
    eModbus
lib_ignore =
    ESPAsyncTCP

[env:dut_harihanv_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/harihanv/>

[env:dut_tobiasfaust_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/tobiasfaust/>

[env:dut_emodbus_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/emodbus/>
lib_deps =
    symlink://lib/eModbus

[env:dut_namnam_iot_arduino_s3]
extends = s3_dut_base
build_src_filter =
    -<*>
    +<dut/namnam_iot/>
lib_deps =
    4-20ma/ModbusMaster

[env:dut_esp_modbus_espidf_s3]
extends = s3_espidf_dut_base
build_flags =
    ${s3_espidf_dut_base.build_flags}
    -DDUT_ESP_MODBUS

[env:dut_maxx_ukoo_espidf_s3]
extends = s3_espidf_dut_base
build_flags =
    ${s3_espidf_dut_base.build_flags}
    -DDUT_MAXX_UKOO
