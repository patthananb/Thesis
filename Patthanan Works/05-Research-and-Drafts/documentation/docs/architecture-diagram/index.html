<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIoT Lab Platform - System Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0b0f1a;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(96,165,250,0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,0.03) 0%, transparent 50%);
  }
  svg { display: block; width: 100%; height: auto; }
  .node:hover { filter: brightness(1.12); }
  .flow-line {
    stroke-dasharray: 8 5;
    animation: dash 2s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -26; } }
</style>
</head>
<body>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#a78bfa"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#f87171"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#60a5fa"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#fbbf24"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#4ade80"/>
    </marker>
    <marker id="a-pink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#f472b6"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8z" fill="#64748b"/>
    </marker>

    <!-- Rounded rect clip for inner software boxes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ═══════════════ TITLE ═══════════════ -->
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#e2e8f0" letter-spacing="-0.5">Low-Cost Industrial IoT Laboratory Platform</text>
  <text x="600" y="62" text-anchor="middle" font-size="11" fill="#475569">System Architecture  —  Siemens LOGO! 8.4  ·  WT32-ETH01 (ESP32)  ·  Raspberry Pi  ·  Samkoon HMI</text>

  <!-- ═══════════════ LAYER LABELS (left side) ═══════════════ -->
  <text x="16" y="200" font-size="9" font-weight="600" fill="#334155" transform="rotate(-90 16 200)" text-anchor="middle" letter-spacing="2">FIELD DEVICES</text>
  <text x="16" y="520" font-size="9" font-weight="600" fill="#334155" transform="rotate(-90 16 520)" text-anchor="middle" letter-spacing="2">NETWORK</text>
  <text x="16" y="740" font-size="9" font-weight="600" fill="#334155" transform="rotate(-90 16 740)" text-anchor="middle" letter-spacing="2">GATEWAY · SCADA</text>

  <!-- Thin layer separator lines -->
  <line x1="40" y1="430" x2="1160" y2="430" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="580" x2="1160" y2="580" stroke="#1e293b" stroke-width="1"/>

  <!-- ═══════════════ TOP ROW: FIELD DEVICES ═══════════════ -->

  <!-- ── I/O Panel + Extensions ── -->
  <g class="node">
    <rect x="40" y="90" width="200" height="130" rx="12" fill="#0f1f15" stroke="#2d6a4f" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="40" y="90" width="200" height="30" rx="12" fill="#2d6a4f" opacity="0.2"/>
    <text x="62" y="111" font-size="12" font-weight="700" fill="#86efac">I/O Panel + Extensions</text>
    <text x="60" y="140" font-size="10" fill="#6ee7b7">DM8 / DM16 Digital Modules</text>
    <text x="60" y="156" font-size="10" fill="#6ee7b7">AM2 Analog Module</text>
    <text x="60" y="172" font-size="10" fill="#6ee7b7">Buttons · Switches · LEDs</text>
    <text x="60" y="188" font-size="10" fill="#6ee7b7">Terminal Blocks</text>
  </g>

  <!-- ── Relay Board ── -->
  <g class="node">
    <rect x="40" y="240" width="200" height="90" rx="12" fill="#0f1f15" stroke="#2d6a4f" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="40" y="240" width="200" height="30" rx="12" fill="#2d6a4f" opacity="0.2"/>
    <text x="62" y="261" font-size="12" font-weight="700" fill="#86efac">Relay Board</text>
    <text x="60" y="288" font-size="10" fill="#6ee7b7">AC/DC Load Switching</text>
    <text x="60" y="304" font-size="10" fill="#6ee7b7">Pump · Valve · Motor</text>
  </g>

  <!-- ── LOGO! PLC ── -->
  <g class="node">
    <rect x="300" y="100" width="240" height="185" rx="14" fill="#150d28" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="300" y="100" width="240" height="34" rx="14" fill="#7c3aed" opacity="0.15"/>
    <text x="320" y="123" font-size="14" font-weight="700" fill="#c4b5fd">Siemens LOGO! 8.4</text>
    <rect x="496" y="106" width="36" height="16" rx="4" fill="#7c3aed"/>
    <text x="514" y="118" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">DEL 1</text>
    <text x="320" y="155" font-size="11" fill="#a5b4fc">Modbus TCP Slave</text>
    <text x="320" y="173" font-size="11" fill="#a5b4fc">Modbus TCP Master</text>
    <text x="320" y="191" font-size="11" fill="#a5b4fc">Native MQTT Client</text>
    <text x="320" y="209" font-size="11" fill="#a5b4fc">FBD / Ladder Logic</text>
    <rect x="320" y="230" width="110" height="18" rx="5" fill="#1a0f30" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="375" y="243" text-anchor="middle" font-size="9" font-weight="600" fill="#a78bfa">192.168.1.10</text>
    <text x="320" y="268" font-size="9" fill="#5b4f80">LOGO! Soft Comfort</text>
  </g>

  <!-- ── ESP32 ── -->
  <g class="node">
    <rect x="610" y="100" width="240" height="185" rx="14" fill="#1f0d0d" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="610" y="100" width="240" height="34" rx="14" fill="#ef4444" opacity="0.15"/>
    <text x="630" y="123" font-size="14" font-weight="700" fill="#fca5a5">WT32-ETH01 (ESP32)</text>
    <rect x="806" y="106" width="36" height="16" rx="4" fill="#ef4444"/>
    <text x="824" y="118" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">DEL 2</text>
    <text x="630" y="155" font-size="11" fill="#fca5a5">Modbus TCP Slave</text>
    <text x="630" y="173" font-size="11" fill="#fca5a5">Modbus TCP Master</text>
    <text x="630" y="191" font-size="11" fill="#fca5a5">MQTT Client</text>
    <text x="630" y="209" font-size="11" fill="#fca5a5">LAN8720 Ethernet</text>
    <rect x="630" y="230" width="110" height="18" rx="5" fill="#200d0d" stroke="#ef4444" stroke-width="0.5"/>
    <text x="685" y="243" text-anchor="middle" font-size="9" font-weight="600" fill="#f87171">192.168.1.20</text>
    <text x="630" y="268" font-size="9" fill="#805050">Arduino / PlatformIO</text>
  </g>

  <!-- ── Sensors / Actuators ── -->
  <g class="node">
    <rect x="920" y="100" width="200" height="130" rx="12" fill="#0f1f15" stroke="#2d6a4f" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="920" y="100" width="200" height="30" rx="12" fill="#2d6a4f" opacity="0.2"/>
    <text x="942" y="121" font-size="12" font-weight="700" fill="#86efac">Sensors / Actuators</text>
    <text x="940" y="150" font-size="10" fill="#6ee7b7">Level Sensor (Water Tank)</text>
    <text x="940" y="166" font-size="10" fill="#6ee7b7">Digital I/O Panel</text>
    <text x="940" y="182" font-size="10" fill="#6ee7b7">Analog Inputs</text>
    <text x="940" y="198" font-size="10" fill="#6ee7b7">Actuator Outputs</text>
  </g>

  <!-- ── Samkoon HMI ── -->
  <g class="node">
    <rect x="920" y="260" width="240" height="150" rx="14" fill="#1f1508" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="920" y="260" width="240" height="34" rx="14" fill="#f59e0b" opacity="0.15"/>
    <text x="940" y="283" font-size="14" font-weight="700" fill="#fcd34d">Samkoon HMI</text>
    <rect x="1116" y="266" width="36" height="16" rx="4" fill="#f59e0b"/>
    <text x="1134" y="278" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">DEL 4</text>
    <text x="940" y="315" font-size="11" fill="#fcd34d">Modbus TCP Client</text>
    <text x="940" y="333" font-size="11" fill="#fcd34d">Operator Interface</text>
    <text x="940" y="351" font-size="11" fill="#fcd34d">Start/Stop · Status · Values</text>
    <rect x="940" y="370" width="110" height="18" rx="5" fill="#201508" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="995" y="383" text-anchor="middle" font-size="9" font-weight="600" fill="#fbbf24">192.168.1.30</text>
  </g>

  <!-- ═══════════════ WIRED I/O CONNECTIONS (green) ═══════════════ -->
  <!-- I/O Panel → LOGO! -->
  <path d="M 240 155 L 300 170" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#a-green)"/>
  <text x="258" y="153" font-size="8" font-weight="600" fill="#4ade80">Wired</text>

  <!-- Relay → LOGO! -->
  <path d="M 240 270 L 300 240" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#a-green)"/>

  <!-- Sensors → ESP32 -->
  <path d="M 920 165 L 850 175" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#a-green)"/>
  <text x="870" y="160" font-size="8" font-weight="600" fill="#4ade80">GPIO/ADC</text>

  <!-- ═══════════════ LOGO! ↔ ESP32 (Modbus master/slave) ═══════════════ -->
  <path d="M 540 190 L 610 190" fill="none" stroke="#f472b6" stroke-width="2" class="flow-line" marker-start="url(#a-purple)" marker-end="url(#a-red)"/>
  <rect x="548" y="172" width="54" height="14" rx="3" fill="#1a0a1a"/>
  <text x="575" y="183" text-anchor="middle" font-size="8" font-weight="600" fill="#f472b6">Modbus</text>

  <!-- ═══════════════ MIDDLE ROW: NETWORK ═══════════════ -->

  <!-- Ethernet Switch -->
  <rect x="250" y="475" width="660" height="54" rx="27" fill="#0f1525" stroke="#334155" stroke-width="1.2"/>
  <text x="580" y="499" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">Ethernet Switch</text>
  <text x="580" y="517" text-anchor="middle" font-size="10" fill="#475569">Local Network  ·  192.168.1.x</text>

  <!-- ═══════════════ VERTICAL CONNECTIONS TO SWITCH ═══════════════ -->

  <!-- LOGO! → Switch (two lines: Modbus + MQTT) -->
  <path d="M 410 285 L 410 475" fill="none" stroke="#a78bfa" stroke-width="1.8" class="flow-line" marker-end="url(#a-purple)"/>
  <path d="M 430 285 L 430 475" fill="none" stroke="#22c55e" stroke-width="1.8" class="flow-line" marker-end="url(#a-green)"/>
  <rect x="440" y="360" width="80" height="16" rx="4" fill="#150d28" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="480" y="372" text-anchor="middle" font-size="8" font-weight="600" fill="#a78bfa">Modbus TCP</text>
  <rect x="440" y="380" width="52" height="16" rx="4" fill="#081a0e" stroke="#22c55e" stroke-width="0.5"/>
  <text x="466" y="392" text-anchor="middle" font-size="8" font-weight="600" fill="#4ade80">MQTT</text>

  <!-- ESP32 → Switch -->
  <path d="M 730 285 L 730 475" fill="none" stroke="#f87171" stroke-width="1.8" class="flow-line" marker-end="url(#a-red)"/>
  <rect x="735" y="355" width="100" height="16" rx="4" fill="#1f0d0d" stroke="#ef4444" stroke-width="0.5"/>
  <text x="785" y="367" text-anchor="middle" font-size="8" font-weight="600" fill="#f87171">Modbus + MQTT</text>

  <!-- HMI → Switch -->
  <path d="M 1040 410 L 880 502 " fill="none" stroke="#fbbf24" stroke-width="1.8" class="flow-line" marker-end="url(#a-amber)"/>
  <rect x="935" y="438" width="80" height="16" rx="4" fill="#1f1508" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="975" y="450" text-anchor="middle" font-size="8" font-weight="600" fill="#fbbf24">Modbus TCP</text>

  <!-- RPi → Switch (two lines: Modbus from Node-RED + MQTT to Mosquitto) -->
  <path d="M 570 580 L 570 529" fill="none" stroke="#f97316" stroke-width="1.8" class="flow-line" marker-end="url(#a-blue)"/>
  <path d="M 590 580 L 590 529" fill="none" stroke="#22c55e" stroke-width="1.8" class="flow-line" marker-end="url(#a-blue)"/>

  <!-- MQTT path annotation: LOGO! → Mosquitto via switch -->
  <rect x="596" y="545" width="140" height="28" rx="6" fill="#081a0e" stroke="#22c55e" stroke-width="0.6"/>
  <text x="666" y="557" text-anchor="middle" font-size="8" font-weight="600" fill="#4ade80">LOGO! MQTT → Mosquitto</text>
  <text x="666" y="568" text-anchor="middle" font-size="7" fill="#2d6a4f">Node-RED subscribes to topics</text>

  <!-- ═══════════════ BOTTOM ROW: GATEWAY / SCADA ═══════════════ -->

  <!-- ── Raspberry Pi ── -->
  <g class="node">
    <rect x="200" y="610" width="760" height="175" rx="16" fill="#0d1525" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="200" y="610" width="760" height="38" rx="16" fill="#3b82f6" opacity="0.1"/>
    <text x="232" y="636" font-size="16" font-weight="800" fill="#93c5fd">Raspberry Pi</text>
    <text x="375" y="636" font-size="12" fill="#64748b">IoT Gateway  ·  Local Server</text>
    <rect x="916" y="618" width="36" height="16" rx="4" fill="#3b82f6"/>
    <text x="934" y="630" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">DEL 3</text>

    <!-- 4 software boxes in a clean row -->
    <!-- Mosquitto -->
    <rect x="228" y="665" width="160" height="52" rx="10" fill="#081a0e" stroke="#22c55e" stroke-width="1"/>
    <text x="248" y="686" font-size="11" font-weight="700" fill="#86efac">Mosquitto MQTT</text>
    <text x="248" y="702" font-size="9" fill="#4ade80">Broker  ·  port 1883</text>

    <!-- Node-RED -->
    <rect x="408" y="665" width="160" height="52" rx="10" fill="#1a0f04" stroke="#f97316" stroke-width="1"/>
    <text x="428" y="686" font-size="11" font-weight="700" fill="#fdba74">Node-RED</text>
    <text x="428" y="702" font-size="9" fill="#fb923c">Flows + Dashboard  ·  port 1880</text>

    <!-- InfluxDB -->
    <rect x="588" y="665" width="160" height="52" rx="10" fill="#060f1a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="608" y="686" font-size="11" font-weight="700" fill="#7dd3fc">InfluxDB</text>
    <text x="608" y="702" font-size="9" fill="#38bdf8">Time-series DB  ·  port 8086</text>

    <!-- Grafana -->
    <rect x="768" y="665" width="160" height="52" rx="10" fill="#1a1204" stroke="#f59e0b" stroke-width="1"/>
    <text x="788" y="686" font-size="11" font-weight="700" fill="#fcd34d">Grafana</text>
    <text x="788" y="702" font-size="9" fill="#fbbf24">Dashboards  ·  port 3000</text>

    <!-- Internal flow arrows -->
    <!-- Mosquitto → Node-RED -->
    <path d="M 388 691 L 408 691" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a-gray)"/>
    <!-- Node-RED → InfluxDB -->
    <path d="M 568 691 L 588 691" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a-gray)"/>
    <!-- InfluxDB → Grafana -->
    <path d="M 748 691 L 768 691" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a-gray)"/>

    <!-- Docker label -->
    <rect x="368" y="735" width="420" height="22" rx="6" fill="#0a1220" stroke="#1e293b" stroke-width="0.8"/>
    <text x="578" y="750" text-anchor="middle" font-size="9" fill="#475569">All services running in Docker containers</text>

    <!-- IP -->
    <rect x="228" y="740" width="110" height="18" rx="5" fill="#0d1525" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="283" y="753" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">192.168.1.100</text>
  </g>

  <!-- ═══════════════ DELIVERABLES BAR ═══════════════ -->
  <rect x="150" y="830" width="900" height="48" rx="12" fill="#0f1525" stroke="#1e293b" stroke-width="1"/>
  <text x="190" y="851" font-size="10" font-weight="700" fill="#64748b">DELIVERABLES</text>

  <rect x="310" y="840" width="175" height="22" rx="5" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="320" y="855" font-size="9" fill="#c4b5fd"><tspan font-weight="700">1</tspan>  LOGO! Modbus slave + master</text>

  <rect x="500" y="840" width="175" height="22" rx="5" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="0.5"/>
  <text x="510" y="855" font-size="9" fill="#fca5a5"><tspan font-weight="700">2</tspan>  ESP32 Modbus master/slave</text>

  <rect x="690" y="840" width="140" height="22" rx="5" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="700" y="855" font-size="9" fill="#93c5fd"><tspan font-weight="700">3</tspan>  Visualize on Grafana</text>

  <rect x="845" y="840" width="165" height="22" rx="5" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="855" y="855" font-size="9" fill="#fcd34d"><tspan font-weight="700">4</tspan>  Visualize on Samkoon HMI</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <g transform="translate(70, 880)">
    <!-- Modbus TCP -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="30" y="12" font-size="9" fill="#64748b">Modbus TCP</text>
    <!-- MQTT -->
    <line x1="130" y1="8" x2="154" y2="8" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="160" y="12" font-size="9" fill="#64748b">MQTT</text>
    <!-- ESP32 Modbus+MQTT -->
    <line x1="220" y1="8" x2="244" y2="8" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="250" y="12" font-size="9" fill="#64748b">ESP32 (Modbus + MQTT)</text>
    <!-- Master/Slave -->
    <line x1="420" y1="8" x2="444" y2="8" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="450" y="12" font-size="9" fill="#64748b">Master ↔ Slave</text>
    <!-- Wired -->
    <line x1="570" y1="8" x2="594" y2="8" stroke="#4ade80" stroke-width="2"/>
    <text x="600" y="12" font-size="9" fill="#64748b">Wired I/O</text>
    <!-- HMI -->
    <line x1="680" y1="8" x2="704" y2="8" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="710" y="12" font-size="9" fill="#64748b">HMI (Modbus TCP)</text>
    <!-- Internal -->
    <line x1="850" y1="8" x2="874" y2="8" stroke="#64748b" stroke-width="1"/>
    <text x="880" y="12" font-size="9" fill="#64748b">Internal (RPi)</text>
  </g>

</svg>
</body>
</html>
